name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: soloweed
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:ci@localhost:5432/soloweed"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Aplica las migraciones versionadas sobre el Postgres vacío del service
      # container; valida de paso que la migración init corre limpia.
      - name: Prepare empty database
        run: npx prisma migrate deploy

      # Falla solo con vulnerabilidades high/critical; las moderadas del postcss
      # embebido en Next no bloquean.
      - name: Audit (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build (webpack)
        run: npm run build
