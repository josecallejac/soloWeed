name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit tests, E2E and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci_admin
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # URL sintácticamente válida y sin acceso a producción. El catálogo maneja
      # la BD no disponible durante build y las pruebas unitarias no la consultan.
      DATABASE_URL: postgresql://soloweed_e2e:ci@127.0.0.1:5432/soloweed_e2e
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      # CPU binaries are bundled; this QA job does not need optional CUDA downloads.
      ONNXRUNTIME_NODE_INSTALL: "skip"
      SKIP_DATABASE_STATIC_PARAMS: "1"
      E2E_DATABASE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - name: Validar scripts operativos Bash
        run: |
          bash -n scripts/ops/check-health.sh
          bash -n scripts/ops/verify-release.sh
          bash -n scripts/ops/notify-telegram.sh
          bash -n scripts/ops/run-weekly-catalog-scheduled.sh
          bash -n scripts/ops/run-backup-scheduled.sh
          bash -n scripts/ops/install-systemd-user.sh
      - name: Crear base y rol exclusivos de QA en el servicio efimero
        env:
          QA_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$QA_POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE soloweed_e2e LOGIN PASSWORD 'ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE soloweed_e2e OWNER soloweed_e2e;
          SQL
      - run: npx tsx scripts/verify-e2e-database.ts
      - run: npx prisma migrate deploy
      - run: npx tsx scripts/seed-e2e.ts
        env:
          E2E_DATABASE: "1"
      - run: npm run lint
      - run: npm run test
      - name: Verificar curacion con PostgreSQL de QA
        run: npx tsx --test tests/curation-persistence.integration.test.ts
        env:
          CURATION_DB_TEST: "1"
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e -- --project=chromium --project=mobile-chromium
      - if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e -- --project=firefox --project=webkit
      - if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: playwright-report/
          retention-days: 3
