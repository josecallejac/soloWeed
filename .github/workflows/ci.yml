name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    env:
      # URL sintácticamente válida y sin acceso a producción. El catálogo maneja
      # la BD no disponible durante build y las pruebas unitarias no la consultan.
      DATABASE_URL: postgresql://soloweed:ci@127.0.0.1:5432/soloweed
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
