name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El repo no versiona migraciones (solo migration_lock.toml); el esquema se
      # aplica directo desde schema.prisma sobre una SQLite vacía.
      - name: Prepare empty database
        run: npx prisma db push --skip-generate

      # Falla solo con vulnerabilidades high/critical; las moderadas del postcss
      # embebido en Next no bloquean.
      - name: Audit (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build (webpack)
        run: npm run build
